[package]
name = "allock"
description = "A lock screen and greetd greeter for Wayland, drawn as an island"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Simone Camito (Zibo)"]

[[bin]]
name = "allock"
path = "src/main.rs"

[dependencies]
# The island needs main: group blur, arcs, tabular figures, inset shadows.
guido = { git = "https://github.com/MalpenZibo/guido", branch = "main" }
# ashell's design system: tokens, themes, components and the [appearance]
# table, with themes made from a seed or a wallpaper. Only on ashell's local
# feat/experimental-ui branch for now; a git dependency once it is pushed.
ashell-ds = { path = "../ashell/experimental/ashell-ds", features = ["serde", "wallpaper"] }
# Battery, shared with ashell.
ashell-services = { git = "https://github.com/MalpenZibo/ashell", branch = "main", features = ["upower"] }

# UI / runtime
chrono = { version = "0.4", default-features = false, features = ["clock", "unstable-locales"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "process"] }
futures = "0.3"

# Config
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"


# Auth
# MPL-2.0; keeps the unsafe libpam FFI out of the authentication path.
pam-client2 = { version = "0.5", default-features = false }
# GPL-3.0-only, from the greetd author. Compatible with this crate's licence.
greetd_ipc = { version = "0.10", features = ["tokio-codec"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
# Wiping the buffer a password is written to greetd from.
zeroize = "1"
# ext-idle-notify, to rest the fingerprint reader. The versions guido uses.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# wlr-screencopy, for the snapshot the lock starts on.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
uzers = { version = "0.12", default-features = false }
libc = "0.2"

# Plumbing
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
guido = { git = "https://github.com/MalpenZibo/guido", branch = "main", features = ["testing"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
strip = true
opt-level = 3
