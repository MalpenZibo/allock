# allock, ~/.config/allock/config.toml
#
# Every key is optional and shown with its default.

log_level = "warn"

# Which monitors show the clock and the card. Every monitor is covered while
# locked; the others keep the island at rest.
#   "All"                            every monitor
#   { Targets = ["DP-2"] }           connector name, or part of the EDID
#   { Targets = ["DP-2", "eDP-1"] }  every match, mirrored
# A target that is not connected puts the controls on the first monitor.
main_output = "All"

[background]
# "Wallpaper", or "Snapshot": the session as it was when the lock was asked
# for, sharp at first and then blurred, and sharp again as the unlock hands
# back, so nothing on screen jumps. Lock screen only; the picture below
# stands in where the compositor cannot capture (it needs wlr-screencopy).
source = "Wallpaper"
# A picture, or the background colour when unset. `~` and symlinks work.
# path = "~/.config/niri-wallpaper/current"
fit = "Cover"   # Cover | Contain | Stretch
blur = 26.0     # blur of the picture, 0 for a sharp one; resting adds a little
dim = 0.45      # darkening over the picture, 0.0 to 1.0; resting darkens more

[clock]
time_format = "%H:%M"
date_format = "%A %e %B"   # "" hides the date

[auth]
# Needs /etc/pam.d/<name>, see pam/allock.
pam_service = "allock"
# Accept a fingerprint as well as the password, while the card is up. Lock
# screen only.
fingerprint = true
fingerprint_retries = 5
# Seconds without input before the card folds back into the resting island,
# which empties the field and switches the reader off. 0 keeps it up.
idle_timeout = 60

[indicators]
battery = true

# The seed: the dot the island starts and ends as, up past the top edge, and
# where it rests.
[island.seed]
size = 30.0   # diameter, logical pixels
top = 6.0     # from the top edge, logical pixels

# Off by default. Enable it for a bar that draws its own island and implements
# org.allock.Handoff1 (docs/HANDOFF.md): before locking allock asks it to send
# the island away. A bar that is not on the bus costs one round trip; an answer
# later than timeout_ms is not waited for.
[handoff]
enabled = false
timeout_ms = 600

[appearance]
# The colours and the look of everything allock draws. Unset, it is Tokyo
# Night.

# The look from a file of its own, for one shared with another program: it
# holds the keys below, without the [appearance] header. What this table sets
# beside it is written over it. A relative path is from this file's directory.
# import = "~/.config/styletto/styletto.toml"

# Where the colours come from: one of a theme, a seed colour or a wallpaper.
# A theme: "Tokyo Night", "Catppuccin", "Nord", "Gruvbox", "Dracula",
# "Rosé Pine", "Everforest" or "Kanagawa", with its flavours and accent by
# name, the theme's own when unset.
# theme = "Tokyo Night"
# dark_flavor = "Storm"
# light_flavor = "Day"
# accent = "Blue"
# Each flavour's own accent, over accent.
# dark_accent = "Blue"
# light_accent = "Blue"
# Or both flavours worked out from one colour, as Material You does...
# seed = "#6750a4"
# ...or from the colour that fits a picture best. It is read as the lock
# starts, so a large picture makes it start later.
# wallpaper = "~/Pictures/wallpaper.jpg"
# Which of the colours the picture yields, best first, the flavours are made
# of: 0, the best; one past the last is the best too.
# wallpaper_color = 0
# How a seed or a wallpaper spreads: "tonal-spot", "vibrant", "expressive",
# "content", "fidelity", "neutral", "monochrome", "rainbow", "fruit-salad";
# and how far apart its tones are: "standard", "medium", "high".
# variant = "tonal-spot"
# contrast = "standard"

# "auto", "dark" or "light": which flavour shows. A lock comes up before it
# could ask the desktop, so "auto" shows the dark one.
mode = "auto"
# "compact", "default" or "comfortable": type, controls and space move a step.
density = "default"
# "square", "soft" or "round": corners move a step; pills stay pills.
shape = "soft"
# "solid", "translucent" or "glass": the island's opacity and the blur behind it.
material = "solid"
# "full", "reduced" (fades only) or "none".
motion = "full"

# Font families by name; the system's when unset.
# [appearance.fonts]
# sans = "Inter"
# mono = "JetBrains Mono"

# Colours set over each flavour, by name: background (the
# island), text, sub, dim, accent, success, warning, danger; on_accent,
# on_success, on_warning, on_danger for what reads on each fill; and
# accent_text, success_text, warning_text, danger_text for each hue as text on
# the island, worked out from the fill when unset.
# [appearance.dark]
# accent = "#7aa2f7"
# [appearance.light]
# accent = "#2e7de9"

# Greeter only (allock --greeter).
[greeter]
# The user picker lists the accounts in /etc/passwd with a uid in
# UID_MIN..UID_MAX (/etc/login.defs) and a login shell, then "Other…".
other_user = true            # offer "Other…" to type any user name
# user = "zibo"              # preselect this account
# default_session = "Niri"   # always start on this session, any case
remember = true              # start on the last user and session
# Where a session prints while it starts: "Journal" (through systemd-cat) or
# "Console".
session_output = "Journal"

# Your own session list. Without one, allock reads /usr/share/wayland-sessions
# and /usr/share/xsessions.
# [[greeter.session]]
# name = "niri"
# command = ["niri-session"]
# env = ["XDG_SESSION_TYPE=wayland"]
