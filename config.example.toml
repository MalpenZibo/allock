# allock — ~/.config/allock/config.toml
#
# Every key below is optional and shown with its default. allock deliberately
# does not let you move things around: the layout is fixed, the config picks
# colours, wallpaper, formats and which indicators appear.

log_level = "warn"

# Where the [appearance] table comes from. allock does not own its own look —
# it borrows ashell's, so retheming ashell retints the lock screen too.
# Set to "" to skip the import and use allock's built-in defaults.
ashell_config = "~/.config/ashell/config.toml"

# Which outputs draw the interface — clock, login card, status row. Every
# output is always covered by a lock surface showing the background; this only
# says which of them carry the controls on top of it.
#   "All"                          — every screen (default)
#   { Targets = ["DP-2"] }         — connector name, or a substring of the EDID
#   { Targets = ["DP-2", "eDP-1"] }— every one that matches, mirrored
# Naming a monitor that is not connected — or unplugging it while the screen is
# locked — puts the controls on the first output instead, so they are never on
# a screen that is not there.
main_output = "All"

[background]
# Omit for a plain [appearance] background colour. `~` is expanded and symlinks
# are followed, so a wallpaper daemon's `current` link works; a dangling link
# counts as "no image".
# path = "~/.config/niri-wallpaper/current"
fit = "Cover"     # Cover | Contain | Stretch
dim = 0.35        # black scrim over the image, 0.0–1.0

# The cards show a blurred cut-out of the wallpaper behind them — frosted
# glass, done by guido's backdrop_blur. Note this is *not* the compositor's
# blur: a session lock surface has nothing composited underneath it, and the
# wallpaper is drawn by allock inside its own surface.
blur = 32.0          # radius in logical pixels; 0 gives plain translucent cards
card_opacity = 0.72  # how much card tint covers the blur, 0.0-1.0

[clock]
time_format = "%H:%M"
date_format = "%A %e %B"   # empty string hides the date line

[auth]
# Needs a matching /etc/pam.d/<name>; see pam/allock in this repository.
pam_service = "allock"

# Verify against fprintd alongside the password.
#
# This is an extra way in, not a replacement: the password field keeps
# working, and a fingerprint match is accepted on fprintd's word — the same
# trust model hyprlock and the GNOME/KDE lock screens use. Set to false to
# require the password. Ignored in greeter mode, where greetd owns the
# session and a local identity check would not produce one.
fingerprint = true
fingerprint_retries = 5

[indicators]
battery = true

# --- greeter mode only (allock --greeter) ----------------------------------

[greeter]
# Preselected account. Omit or leave empty to have the form ask for it first.
# user = "zibo"

# Start on the last account and session that signed in successfully, kept in
# $XDG_CACHE_HOME/allock/last-login.toml. The name is typed into the field for
# you, so somebody else can still clear it and sign in. Off leaves nothing on
# disk to read or to write — on a shared machine the last user name is a hint
# about who uses it.
remember = true

# Sessions offered by the picker. With none listed, allock scans
# /usr/share/wayland-sessions and /usr/share/xsessions.
# [[greeter.session]]
# name = "niri"
# command = ["niri-session"]
# env = ["XDG_SESSION_TYPE=wayland"]
